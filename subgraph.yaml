specVersion: 0.0.4
description: StoryHunt - StoryhuntLocker
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: StoryhuntLocker
    network: story
    source:
      address: "0x3E251C5ACC4bd5ECe6f57BafEAC98811D187dd12"
      abi: StoryhuntLocker
      startBlock: 5435000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      file: ./src/mappings/StoryhuntLocker.ts
      entities:
        - StoryhuntLocker
        - Pool
        - User
        - Position
      abis:
        - name: StoryhuntLocker
          file: ./abis/StoryhuntV3Locker.json
        - name: ERC20
          file: ./abis/ERC20.json
        - name: ERC20SymbolBytes
          file: ./abis/ERC20SymbolBytes.json
        - name: ERC20NameBytes
          file: ./abis/ERC20NameBytes.json
        - name: Factory
          file: ./abis/factory.json
        - name: Pool
          file: ./abis/pool.json
        - name: NonfungiblePositionManager
          file: ./abis/NonfungiblePositionManager.json
      eventHandlers:
        - event: StoryHuntNFTLocked(indexed address,indexed uint256,uint256,uint256,uint256)
          handler: handleLock
        - event: UnlockStoryHuntNFT(indexed address,address,indexed uint256)
          handler: handleUnlock
