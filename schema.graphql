type Position @entity {
  id: ID!
  owner: Bytes!
  pool: Bytes!
  token0: Bytes!
  token1: Bytes!
  liquidity: BigInt!
  feeGrowthInside0LastX128: BigInt!
  feeGrowthInside1LastX128: BigInt!
  tickLowerInt: BigInt
  tickUpperInt: BigInt
}


type PositionSnapshot @entity {
  id: ID!
  owner: Bytes!
  pool: Bytes!
  position: Position!
  blockNumber: BigInt!
  timestamp: BigInt!
  liquidity: BigInt!
}