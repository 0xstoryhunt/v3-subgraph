
type Pool @entity {
  id: ID!
  timestamp: BigInt!
  block: BigInt!
  Positions: [Position!]! @derivedFrom(field: "pool")
}

type Position @entity {
  # tokenId
  id: ID!
  pool: Pool!
  liquidity: BigInt!
  timestamp: BigInt!
  finishTimestamp: BigInt!
  block: BigInt!
  user: User!
  isLocked: Boolean!
}

type User @entity {
  id: ID!
  address: Bytes!
  timestamp: BigInt!
  block: BigInt!
}
